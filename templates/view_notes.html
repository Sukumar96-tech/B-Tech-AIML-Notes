{% extends "base.html" %}

{% block title %}
Notes
{% endblock %}

{% block content %}

<div class="hero">

<h1>

📄 Notes

</h1>

</div>

<table border="1" width="100%" cellpadding="10">

<tr>

<th>ID</th>

<th>Title</th>

<th>Subject</th>

<th>Action</th>

</tr>

{% for note in notes %}

<tr>

<td>{{note.id}}</td>

<td>{{note.title}}</td>

<td>{{note.subject.name}}</td>

<td>

<a href="/admin/note/delete/{{note.id}}">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
