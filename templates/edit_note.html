
{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>✏️ Edit Note</h1>

        <form method="POST">

            <div class="form-group">

                <label>Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ note.title }}"
                    required>

            </div>

            <div class="form-group">

                <label>Drive Link</label>

                <input
                    type="url"
                    name="drive_link"
                    value="{{ note.drive_link }}"
                    required>

            </div>

            <div class="form-group">

                <label>Download Link</label>

                <input
                    type="url"
                    name="download_link"
                    value="{{ note.download_link }}"
                    required>

            </div>

            <button type="submit">
                Update
            </button>

        </form>

    </div>

</div>

{% endblock %}
