{% extends "base.html" %}

{% block title %}
Add Note
{% endblock %}

{% block content %}

<div class="hero">
    <h1>📝 Add Note</h1>
</div>

<div class="login-container">

<div class="login-card">

<form method="POST">

<label>

Select Subject

</label>

<select name="subject_id" required>

{% for subject in subjects %}

<option value="{{subject.id}}">

{{subject.year.name}} - {{subject.name}}

</option>

{% endfor %}

</select>

<br><br>

<label>

Title

</label>

<input
type="text"
name="title"
placeholder="Example: Unit 1 Notes"
required>

<br><br>

<label>

Google Drive Link

</label>

<input
type="url"
name="drive_link"
required>

<br><br>

<label>

Download Link

</label>

<input
type="url"
name="download_link"
required>

<br><br>

<button type="submit">

Save Note

</button>

</form>

</div>

</div>

{% endblock %}
