
{% extends "base.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>🔐 Admin Login</h1>

        <form action="/admin/login" method="POST">

            <div class="form-group">
                <label>Username</label>
                <input type="text"
                       name="username"
                       placeholder="Enter Username"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter Password"
                       required>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
