{% extends "base.html" %}

{% block title %}
Add Year
{% endblock %}

{% block content %}

<div class="hero">
    <h1>➕ Add Year</h1>
</div>

<div class="login-container">

    <div class="login-card">

        <form method="POST">

            <label>Year Name</label>

            <input
                type="text"
                name="name"
                placeholder="Example: 1st Year"
                required>

            <br><br>

            <button type="submit">
                Save Year
            </button>

        </form>

    </div>

</div>

{% endblock %}
